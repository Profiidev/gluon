name: Publish Lint Results
on:
  workflow_run:
    workflows: [Checks and Validation]
    types: [completed]

env:
  HAS_COMMIT_BOT_KEY: ${{ secrets.COMMIT_BOT_PRIVATE_KEY != '' }}

jobs:
  publish:
    name: Publish lint results
    runs-on: ubuntu-latest
    # Only fork PRs upload results, PRs from this repo create their check runs directly.
    # Never check out or run code from the PR here, this job has a write token
    if: github.event.workflow_run.head_repository.full_name != github.repository
    permissions:
      id-token: write
      actions: read
      checks: write
    steps:
      - uses: profiidev/gluon@d715c4a8bd804db764307ad041e73c1c60ec7382 # v0
        id: gluon
        if: env.HAS_COMMIT_BOT_KEY != 'true'
        with:
          url: https://gluon.profidev.io
          profile: publish
      # Fallback while the broker is down: re-add the COMMIT_BOT_PRIVATE_KEY secret.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        if: env.HAS_COMMIT_BOT_KEY == 'true'
        with:
          client-id: Iv23liM4eWCXa0R0IMG9
          private-key: ${{ secrets.COMMIT_BOT_PRIVATE_KEY }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: lint-results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Publish lint results
        uses: profiidev/rust-lint-action@16801b02ca2bc0441e458d7f713d8a0e8d417927 # v4
        with:
          publish_results: lint-results.json
          github_token: ${{ steps.gluon.outputs.token || steps.app-token.outputs.token }}
