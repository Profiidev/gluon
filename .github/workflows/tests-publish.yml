name: Publish Test Results
on:
  workflow_run:
    workflows: [Tests]
    types: [completed]

jobs:
  publish:
    name: Publish test results
    runs-on: ubuntu-latest
    # Never check out or run code from the PR here, this job has a write token
    if: github.event.workflow_run.conclusion != 'skipped'
    permissions:
      id-token: write
      actions: read
      checks: write
      pull-requests: write
    steps:
      - uses: profiidev/gluon@d715c4a8bd804db764307ad041e73c1c60ec7382 # v0
        id: app-token
        with:
          url: https://gluon.profidev.io
          profile: publish

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: artifacts

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@da5b7be67623cd59bbbd1a0ce4f022050a55605f # v2
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          commit: ${{ github.event.workflow_run.head_sha }}
          event_file: artifacts/event-file/event.json
          event_name: ${{ github.event.workflow_run.event }}
          files: artifacts/test-results*/**/*.xml
