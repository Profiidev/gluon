name: Release Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        default: "v0.0.0"

jobs:
  update-version:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: profiidev/gluon@d715c4a8bd804db764307ad041e73c1c60ec7382 # v0
        id: app-token
        with:
          url: https://gluon.profidev.io
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Update version
        id: update_version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          RAW_TAG=$INPUT_VERSION
          NEW_VERSION="${RAW_TAG#v}"
          echo "Bumping version to $NEW_VERSION"
          sed -i "s/^version = \".*\"/version = \"$NEW_VERSION\"/" backend/Cargo.toml
          cargo metadata -q > /dev/null
          npm ci
          cd action && npm version $NEW_VERSION --no-git-tag-version && npm run build
          cd .. && npx oxfmt

      - name: Create PR
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "Updated version to ${{ github.event.inputs.version }}"
          branch: chore/release-version-${{ github.event.inputs.version }}
          title: "Release version ${{ github.event.inputs.version }}"
          body: "This PR releases the version ${{ github.event.inputs.version }}."
          base: main
          sign-commits: true
          labels: release-version
