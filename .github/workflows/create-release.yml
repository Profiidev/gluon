name: Create Release

on:
  pull_request:
    types:
      - closed
    branches:
      - main
  push:
    tags:
      - "v*.*.*"

jobs:
  create-release-tag:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.merged && contains(github.event.pull_request.labels.*.name, 'release-version') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: profiidev/gluon@d715c4a8bd804db764307ad041e73c1c60ec7382 # v0
        id: app-token
        with:
          url: https://gluon.profidev.io
          profile: pr-automation
      - name: Checkout code
        with:
          token: ${{ steps.app-token.outputs.token }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create tag
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          VERSION=$HEAD_REF
          VERSION=${VERSION#chore/release-version-}
          echo "Creating tag for version $VERSION"
          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Update major tag
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          VERSION=${HEAD_REF#chore/release-version-}
          MAJOR_VERSION=$(echo $VERSION | cut -d. -f1)
          git tag -f "$MAJOR_VERSION"
          git push origin -f "$MAJOR_VERSION"

  create-release:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: profiidev/gluon@d715c4a8bd804db764307ad041e73c1c60ec7382 # v0
        id: app-token
        with:
          url: https://gluon.profidev.io
      - name: Create Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ github.ref_name }}
          token: ${{ steps.app-token.outputs.token }}
          name: Release ${{ github.ref_name }}
          body: |
            Release version ${{ github.ref_name }} has been created.
          generate_release_notes: true
