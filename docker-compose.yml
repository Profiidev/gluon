services:
  backend:
    image: ghcr.io/profiidev/images/rust-musl-watch:main@sha256:5ca814ff5dbed97f7a08efd16612e7a94306b099c3d204fcff715ff2d6952960
    user: '${HOST_UID:-0}:${HOST_GID:-0}'
    volumes:
      - ./backend:/app
    tty: true
    ports:
      - '5173:8000'
      - '9090:9090'
    environment:
      CONFIG_PATH: /app/config.example.toml
    entrypoint: ['tini', '--']
    command: ['cargo', 'watch', '-x', 'run']
